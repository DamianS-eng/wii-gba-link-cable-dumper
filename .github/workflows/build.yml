name: Build with DevkitPro

on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [devkitarm, devkitppc]   # devkitARM = GBA/NDS, devkitPPC = Wii/GameCube
    container:
      image: devkitpro/${{ matrix.target }}:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gba project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          pwd
          ls # debug
          cd gba
          make clean
          make
          cd..

      - name: Build wii project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=${DEVKITPRO}/devkitPPC
          pwd
          ls # debug
          mkdir -p data
          mv -f gba/gba_mb.gba data/gba_mb.gba
          make -f Makefile.wii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
              build/*.elf
              build/*.bin
