name: Build with DevkitPro

on:
  push:
  workflow_dispatch:
jobs:
  gba:
    name: Build GBA
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build gba project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=${DEVKITPRO}/devkitARM
          pwd
          ls # debug
          cd gba
          make clean
          make
          cd ..
          mkdir -p data
          mv -f gba/gba_mb.gba data/gba_mb.gba
          
      - name: Upload GBA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gba-build
          path: |
            data/gba_mb.gba     

  wii:
    name: Build Wii
    runs-on: ubuntu-latest
    needs: gba
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Download GBA artifact
        uses: actions/download-artifact@v4
        with:
          name: gba-build
          path: data
      - name: Build wii project
        run: |
            export DEVKITPRO=/opt/devkitpro
            export DEVKITPPC=${DEVKITPRO}/devkitPPC
            pwd
            ls # debug
            make -f Makefile.wii
  
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
            name: wii-build
            path: |
                build/*.dol
                build/*.elf
                build/*.bin
